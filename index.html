<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Roblox-Style Obby</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEEB;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-weight: bold;
      font-size: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }
    /* On-screen controls for iPad */
    .controls {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 10;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      width: 65px;
      height: 65px;
      background: rgba(255, 255, 255, 0.4);
      border: 3px solid white;
      border-radius: 50%;
      font-size: 24px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn:active {
      background: rgba(255, 255, 255, 0.8);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">Reach the Gold Platform!</div>

  <div class="controls">
    <div class="btn-group">
      <div class="btn" id="leftBtn">◀</div>
      <div class="btn" id="fwdBtn">▲</div>
      <div class="btn" id="rightBtn">▶</div>
    </div>
    <div class="btn" id="jumpBtn" style="background: rgba(255,215,0,0.6);">🦘</div>
  </div>

  <script>
    // 1. Setup 3D Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 15);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x666666));

    // 2. Player (Roblox Style Box)
    const playerGeo = new THREE.BoxGeometry(1, 2, 1);
    const playerMat = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(0, 3, 0);
    scene.add(player);

    // 3. Build Platforms (The Obby)
    const platforms = [];
    function createPlatform(x, y, z, w, h, d, color = 0x888888) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshLambertMaterial({ color });
      const plat = new THREE.Mesh(geo, mat);
      plat.position.set(x, y, z);
      scene.add(plat);
      platforms.push(plat);
      return plat;
    }

    // Start block
    createPlatform(0, 0, 0, 4, 1, 4, 0x444444);
    // Jumps
    createPlatform(0, 1, -6, 3, 1, 3, 0xff0055);
    createPlatform(0, 2, -12, 3, 1, 3, 0x00ccff);
    createPlatform(0, 3, -18, 3, 1, 3, 0xffaa00);
    // Win Goal
    createPlatform(0, 4, -25, 6, 1, 6, 0xffd700);

    // Controls Logic
    const keys = { fwd: false, left: false, right: false, jump: false };

    // Touch Event Listeners
    function bindTouch(id, key) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
    }
    bindTouch('leftBtn', 'left');
    bindTouch('fwdBtn', 'fwd');
    bindTouch('rightBtn', 'right');
    bindTouch('jumpBtn', 'jump');

    // Physics Variables
    let yVelocity = 0;
    let isGrounded = false;

    // Game Loop
    function animate() {
      requestAnimationFrame(animate);

      // Movement
      if (keys.left) player.position.x -= 0.1;
      if (keys.right) player.position.x += 0.1;
      if (keys.fwd) player.position.z -= 0.15;

      // Gravity & Jumping
      if (keys.jump && isGrounded) {
        yVelocity = 0.22;
        isGrounded = false;
      }

      yVelocity -= 0.01; // Gravity
      player.position.y += yVelocity;

      // Collision Detection with Platforms
      isGrounded = false;
      platforms.forEach(plat => {
        const pBox = new THREE.Box3().setFromObject(player);
        const bBox = new THREE.Box3().setFromObject(plat);

        if (pBox.intersectsBox(bBox)) {
          if (yVelocity <= 0 && player.position.y > plat.position.y) {
            player.position.y = plat.position.y + 1.5;
            yVelocity = 0;
            isGrounded = true;
          }
        }
      });

      // Respawn if Fallen
      if (player.position.y < -10) {
        player.position.set(0, 3, 0);
        yVelocity = 0;
      }

      // Check Win Condition
      if (player.position.z <= -24 && player.position.y >= 4) {
        document.getElementById('ui').innerText = "YOU WIN! 🎉";
      }

      // Camera Follows Player
      camera.position.set(player.position.x, player.position.y + 4, player.position.z + 8);
      camera.lookAt(player.position);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
